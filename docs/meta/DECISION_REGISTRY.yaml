  - id: ENT-DEC-0029
    title: Scheduler authority is shared, fenced, and non-dispatching
    status: accepted
    date: "2026-07-29"
    summary: >
      One Git-common-root SQLite scheduler authority serializes lease, capacity,
      and assignment decisions. Paid ticks hold the separate budget ledger
      writer guard through scheduler commit, while process identity and epoch
      fencing prevent unsafe takeover; receipts never authorize provider dispatch.
