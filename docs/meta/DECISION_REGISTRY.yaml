    related_issues: ["#192"]
    supersedes: []
    superseded_by: null

  - id: ENT-DEC-0011
    title: Organization QAnstitution imports stay local-first and controlled
    status: accepted
    date: "2026-05-31"
    summary: >
      Governance imports should support federated policy while preventing
      surprising remote execution, uncontrolled overrides, or accidental
      weakening of final gates.
    tags: [qanstitution, imports, governance, security]
    source_links:
      - path: decisions/ADR-0011-organization-qanstitution-import-controls.md
        role: adr
