  - id: ENT-DEC-0014
    title: Decision memory is compressed with pointers, not deleted
    status: accepted
    date: "2026-06-04"
    summary: >
      Durable decision summaries belong in this registry so agents can retrieve
      context quickly. Raw exports, ADRs, docs, and issue evidence remain the
      source trail; archiving means lowering default read priority, not deleting
      or replacing history.
    tags: [context-preservation, hallucination-control, source-history]
    source_links:
      - path: docs/meta/DECISION_REGISTRY.yaml
        role: registry
