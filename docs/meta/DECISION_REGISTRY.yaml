  - id: ENT-DEC-0019
    title: OpenCode autonomy is risk-tiered, not unrestricted
    status: accepted
    date: "2026-06-12"
    summary: >
      OpenCode/DeepSeek can keep Entroping shipping during Codex capacity
      exhaustion only through documented Tier A autonomous lanes for low-risk
      docs, tests, guard tests, prompt-library maintenance, and non-runtime
      scripts after issue-scoped worktrees, PR autonomy declaration,
      deterministic gates, green CI, and finish cleanup. Tier B work requires
      human or Codex review before merge, and Tier C runtime, Hurl, redaction,
      proxy, provider-boundary, release, architecture, secrets, security, and
      audit-evidence work must never merge autonomously.
    tags: [agents, opencode, deepseek, autonomy, workflow, ci]
    source_links:
