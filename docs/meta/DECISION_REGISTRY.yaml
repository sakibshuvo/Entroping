    related_issues: ["#330", "#331", "#332", "#401", "#447"]
    supersedes: []
    superseded_by: null

  - id: ENT-DEC-0012
    title: The Entroping and QAnstitution brand language stays intentional
    status: accepted
    date: "2026-06-01"
    summary: >
      Entroping keeps its invented vocabulary and philosophy. Public docs should
      explain the terms clearly and avoid overclaiming autonomous-agent behavior,
      but naming should not be diluted for generic adoption pressure.
    tags: [brand, qanstitution, product-positioning]
    source_links:
      - path: decisions/ADR-0012-brand-integrity-and-qanstitution-name.md
        role: adr
      - path: docs/meta/GLOSSARY.md
