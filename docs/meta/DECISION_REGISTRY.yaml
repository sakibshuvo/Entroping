      - docs/product/MARKETING_NOTE.md
    related_issues: ["#349"]
    supersedes: []
    superseded_by: null

  - id: ENT-DEC-0013
    title: Obsidian preserves context; GitHub executes work
    status: accepted
    date: "2026-06-01"
    summary: >
      The repo remains GitHub-native for backlog, PRs, and release evidence.
      Obsidian is a human navigation and source-history layer over tracked
      Markdown, not a second issue tracker or private source of truth.
    tags: [obsidian, github, context-preservation, workflow]
    source_links:
      - path: docs/meta/OBSIDIAN_VS_GITHUB.md
        role: workflow-guide
      - path: docs/meta/KNOWLEDGE_BASE_WORKFLOW.md
