[project]
name = "entroping"
version = "0.1.1"
description = "AI-native quality governance for API and backend systems."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "defusedxml>=0.7.1",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "rich>=13.7",
  "sqlmodel>=0.0.22",
  "typer>=0.12",
]

[project.scripts]
entroping = "entroping.cli.main:app"

[project.optional-dependencies]
ai = ["litellm>=1.70"]
proxy = ["mitmproxy>=12.2.3"]
studio = ["textual>=0.85"]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=7.1.0",
  "radon>=6.0.1",
  "ruff>=0.8",
  "types-defusedxml>=0.7.0.20260504",
  "types-pyyaml>=6.0.12.20260518",
  "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
# mitmproxy 12.2.3 still caps Tornado at 6.5.5, but the security gate
# requires the patched Tornado line until upstream relaxes the bound.
override-dependencies = [
  "tornado>=6.5.6",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "unit: pure domain, schema, and bridge logic tests",
  "adapter: CLI, filesystem, subprocess, YAML, report, proxy, and LLM boundary tests",
  "integration: cross-subsystem tests",
  "smoke: installed CLI and command-surface smoke checks",
  "regression: tests added for fixed bugs or fragile behavior",
  "security: security-sensitive negative tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_decorators = false
warn_unused_ignores = true
