name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Validate PR documentation impact declaration
        if: github.event_name == 'pull_request'
        run: scripts/pr_body_check.py "$GITHUB_EVENT_PATH"

      - name: Run regression suite
        run: scripts/regression.sh --security

  quality-audit:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Run quality audit
        run: scripts/audit_quality.sh

      - name: Upload quality audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-audit-reports
          path: reports
          if-no-files-found: ignore

  docs-site:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build public docs strictly
        run: uvx --with 'mkdocs-material==9.*' mkdocs build --strict

  install-smoke:
    runs-on: ${{ matrix.os }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            hurl_mode: pinned-archive
          - os: macos-latest
            hurl_mode: homebrew
          - os: windows-latest
            hurl_mode: doctor-only
    env:
      HURL_VERSION: "8.0.1"
      HURL_SHA256: "cac7c4670d69444db120edb21fe06c97ba8c80dcc52279957c8dd18f05fb0c06"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install pinned Hurl on Linux
        if: matrix.hurl_mode == 'pinned-archive'
        shell: bash
        run: |
          archive="hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          base_url="https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}"
          download_with_retry() {
            local url="$1"
            local output="$2"
            for attempt in 1 2 3; do
              if curl --fail --location --silent --show-error --output "$output" "$url"; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep $((attempt * 2))
            done
          }
          download_with_retry "$base_url/$archive" "$RUNNER_TEMP/$archive"
          cd "$RUNNER_TEMP"
          test "$HURL_SHA256" = "$(sha256sum "$archive" | awk '{print $1}')"
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Install Hurl on macOS
        if: matrix.hurl_mode == 'homebrew'
        run: brew install hurl

      - name: Verify Hurl formatters are available
        run: |
          command -v hurl
          command -v hurlfmt
          hurlfmt --version

      - name: Install Entroping and smoke CLI on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uv tool install . --force
          tool_bin="$(uv tool dir --bin)"
          entroping_bin="$tool_bin/entroping"
          smoke_dir="$RUNNER_TEMP/entroping-install-smoke"
          rm -rf "$smoke_dir"
          mkdir -p "$smoke_dir"
          # entroping --version
          "$entroping_bin" --version
          cd "$smoke_dir"
          # entroping init --minimal
          "$entroping_bin" init --minimal
          # entroping doctor
          "$entroping_bin" doctor

      - name: Install Entroping and smoke CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv tool install . --force
          $toolBin = (uv tool dir --bin).Trim()
          $entroping = Join-Path $toolBin "entroping.exe"
          $smokeDir = Join-Path $env:RUNNER_TEMP "entroping-install-smoke"
          Remove-Item -Recurse -Force $smokeDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $smokeDir | Out-Null
          # entroping --version
          & $entroping --version
          Set-Location $smokeDir
          # entroping init --minimal
          & $entroping init --minimal
          # entroping doctor
          & $entroping doctor

  optional-extras-smoke:
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install all optional dependencies
        run: uv sync --dev --all-extras

      - name: Run optional extras runtime smoke
        run: uv run python scripts/optional_extras_smoke.py

  live-demo-smoke:
    runs-on: ubuntu-latest
    needs: checks
    env:
      HURL_VERSION: "8.0.1"
      HURL_SHA256: "cac7c4670d69444db120edb21fe06c97ba8c80dcc52279957c8dd18f05fb0c06"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Install Hurl
        run: |
          archive="hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          base_url="https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}"
          download_with_retry() {
            local url="$1"
            local output="$2"
            for attempt in 1 2 3; do
              if curl --fail --location --silent --show-error --output "$output" "$url"; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep $((attempt * 2))
            done
          }
          download_with_retry "$base_url/$archive" "$RUNNER_TEMP/$archive"
          cd "$RUNNER_TEMP"
          test "$HURL_SHA256" = "$(sha256sum "$archive" | awk '{print $1}')"
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

          command -v hurl
          command -v hurlfmt
          hurlfmt --version

      - name: Run live checkout demo smoke
        env:
          ENTROPING_LIVE_DEMO_ARTIFACT_DIR: live-demo-artifacts
        run: scripts/live_demo_smoke.sh

      - name: Upload live demo reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-demo-reports
          path: live-demo-artifacts
          if-no-files-found: ignore
