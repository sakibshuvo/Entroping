name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Run regression suite
        run: scripts/regression.sh

  live-demo-smoke:
    runs-on: ubuntu-latest
    needs: checks
    env:
      HURL_VERSION: "8.0.1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Install Hurl
        run: |
          archive="hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          base_url="https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive.sha256" "$base_url/$archive.sha256"
          cd "$RUNNER_TEMP"
          test "$(cat "$archive.sha256")" = "$(sha256sum "$archive" | awk '{print $1}')"
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Run live checkout demo smoke
        env:
          ENTROPING_LIVE_DEMO_ARTIFACT_DIR: live-demo-artifacts
        run: scripts/live_demo_smoke.sh

      - name: Upload live demo reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-demo-reports
          path: live-demo-artifacts
          if-no-files-found: ignore
