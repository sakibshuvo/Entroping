name: Performance Smoke

'on':
  schedule:
    - cron: "43 8 * * 2"
  workflow_dispatch:

jobs:
  performance-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Run performance smoke
        run: uv run python scripts/performance_smoke.py

      - name: Upload performance smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-smoke
          path: reports/performance-smoke.json
          if-no-files-found: error
