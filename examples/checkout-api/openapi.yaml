openapi: "3.1.0"
info:
  title: Checkout API
  version: "0.1.0"
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /checkout:
    post:
      operationId: createCheckout
      summary: Create a checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cart_id
              properties:
                cart_id:
                  type: string
      responses:
        "201":
          description: Checkout session accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                      - accepted
  /checkout/{checkout_id}:
    get:
      operationId: getCheckout
      summary: Look up a checkout session
      parameters:
        - name: checkout_id
          in: path
          required: true
          example: chk_demo-cart-001
          schema:
            type: string
        - name: include
          in: query
          schema:
            type: string
            enum:
              - events
      responses:
        "200":
          description: Checkout session details
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                  - events
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                      - accepted
                  events:
                    type: array
